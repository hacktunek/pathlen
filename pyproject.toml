[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hacktunek-pathlen"
version = "0.1.0"
description = "在同一个输入里两两比对，检测图检索的关系路径长度相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hacktunek" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hacktunek.github.io"
Repository = "https://github.com/hacktunek/pathlen"
Issues = "https://github.com/hacktunek/pathlen/issues"

[project.scripts]
pathlen = "pathlen:main"

[tool.setuptools]
py-modules = ["pathlen"]
